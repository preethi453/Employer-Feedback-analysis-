<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>
    AI Employee Analytics
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{

      font-family:'Poppins',sans-serif;

      background:#f4f7fb;

      color:#111827;

      display:flex;

      overflow-x:hidden;

      transition:0.3s;
    }

    .menu-toggle{

      position:fixed;

      top:18px;

      left:18px;

      z-index:1000;

      background:rgba(37,99,235,0.95);

      backdrop-filter:blur(10px);

      color:white;

      border:none;

      padding:10px 12px;

      border-radius:12px;

      cursor:pointer;

      font-size:16px;

      box-shadow:0 4px 14px rgba(0,0,0,0.25);

      transition:0.3s;
    }

    .menu-toggle:hover{
      transform:scale(1.05);
    }

    .sidebar{

      width:190px;

      background:rgba(15,23,42,0.78);

      backdrop-filter:blur(14px);

      -webkit-backdrop-filter:blur(14px);

      min-height:100vh;

      padding:90px 15px 20px 15px;

      position:fixed;

      left:0;

      top:0;

      transition:0.3s;

      border-right:1px solid rgba(255,255,255,0.08);

      z-index:999;
    }

    .sidebar.hidden{
      transform:translateX(-100%);
    }

    .sidebar h2{

      color:white;

      margin-bottom:30px;

      font-size:18px;

      margin-top:20px;
    }

    .sidebar a{

      display:flex;

      align-items:center;

      gap:8px;

      color:#e2e8f0;

      text-decoration:none;

      padding:10px 12px;

      border-radius:12px;

      margin-bottom:8px;

      transition:0.3s;

      font-size:14px;
    }

    .sidebar a:hover{

      background:rgba(255,255,255,0.08);

      color:white;

      transform:translateX(5px);
    }

    .main-content{

      margin-left:190px;

      width:100%;

      padding:20px;

      transition:0.3s;
    }

    .main-content.full{
      margin-left:0;
    }

    .hero{

      background:linear-gradient(
        135deg,
        #1e3a8a,
        #2563eb
      );

      padding:40px;

      border-radius:24px;

      color:white;

      margin-bottom:24px;

      box-shadow:0 10px 30px rgba(37,99,235,0.25);
    }

    .hero h1{

      font-size:34px;

      margin-bottom:10px;
    }

    .hero p{

      opacity:0.95;

      font-size:15px;

      line-height:1.7;
    }

    .card{

      background:white;

      padding:24px;

      border-radius:22px;

      box-shadow:0 8px 24px rgba(0,0,0,0.08);

      margin-bottom:24px;

      transition:0.3s;
    }

    .section-title{

      font-size:28px;

      margin-bottom:10px;
    }

    .section-subtitle{

      color:#6b7280;

      margin-bottom:20px;

      font-size:14px;
    }

    textarea{

      width:100%;

      padding:16px;

      border-radius:16px;

      border:1px solid #d1d5db;

      resize:none;

      font-size:14px;

      transition:0.3s;
    }

    textarea:focus{

      outline:none;

      border-color:#2563eb;

      box-shadow:0 0 0 5px rgba(37,99,235,0.12);
    }

    .btn{

      background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
      );

      color:white;

      border:none;

      padding:12px 24px;

      border-radius:14px;

      cursor:pointer;

      font-size:14px;

      transition:0.3s;

      font-weight:500;
    }

    .btn:hover{

      transform:translateY(-3px);

      box-shadow:0 10px 24px rgba(37,99,235,0.3);
    }

    .stats-grid{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(200px,1fr));

      gap:20px;

      margin-bottom:24px;
    }

    .stat-card{

      border-radius:22px;

      padding:24px;

      color:white;

      transition:0.3s;

      box-shadow:0 10px 24px rgba(0,0,0,0.08);
    }

    .stat-card:hover{
      transform:translateY(-8px);
    }

    .stat-card h2{

      font-size:36px;

      margin-top:10px;
    }

    .stat-card p{

      margin-top:6px;

      font-size:14px;

      opacity:0.92;
    }

    .positive{
      background:linear-gradient(135deg,#10b981,#059669);
    }

    .neutral{
      background:linear-gradient(135deg,#f59e0b,#d97706);
    }

    .negative{
      background:linear-gradient(135deg,#ef4444,#dc2626);
    }

    .total{
      background:linear-gradient(135deg,#3b82f6,#2563eb);
    }

    .charts{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:20px;

      margin-bottom:24px;
    }

    .chart-card,
    .table-card{

      background:white;

      padding:24px;

      border-radius:22px;

      box-shadow:0 8px 24px rgba(0,0,0,0.08);

      transition:0.3s;
    }

    table{

      width:100%;

      border-collapse:collapse;

      margin-top:20px;
    }

    th{

      background:#f3f4f6;

      padding:14px;

      text-align:left;

      font-size:13px;
    }

    td{

      padding:14px;

      border-top:1px solid #e5e7eb;

      font-size:13px;
    }

    tr:hover{
      background:#f9fafb;
    }

    .badge{

      padding:6px 12px;

      border-radius:999px;

      color:white;

      font-size:11px;

      font-weight:500;
    }

    .badge-positive{
      background:#10b981;
    }

    .badge-negative{
      background:#ef4444;
    }

    .badge-neutral{
      background:#6b7280;
    }

    .footer{

      margin-top:30px;

      text-align:center;

      color:#6b7280;

      font-size:13px;
    }

    #loader{

      display:none;

      margin-top:20px;

      color:#2563eb;

      font-weight:600;
    }

    /* DARK MODE */

    .dark-mode{

      background:#020617;

      color:white;
    }

    .dark-mode .card,
    .dark-mode .chart-card,
    .dark-mode .table-card{

      background:#0f172a;

      color:white;

      box-shadow:0 8px 24px rgba(0,0,0,0.35);
    }

    .dark-mode .hero{

      background:linear-gradient(
        135deg,
        #1e40af,
        #2563eb
      );
    }

    .dark-mode table{
      color:white;
    }

    .dark-mode th{

      background:#1e293b;

      color:white;
    }

    .dark-mode td{

      border-color:#334155;

      color:white;
    }

    .dark-mode tr:hover{
      background:#1e293b;
    }

    .dark-mode textarea{

      background:#1e293b;

      color:white;

      border:1px solid #475569;
    }

    .dark-mode textarea::placeholder{
      color:#cbd5e1;
    }

    .dark-mode .section-title,
    .dark-mode .section-subtitle,
    .dark-mode .footer,
    .dark-mode h1,
    .dark-mode h2,
    .dark-mode h3,
    .dark-mode p,
    .dark-mode li,
    .dark-mode td,
    .dark-mode th,
    .dark-mode label{

      color:white;
    }

    .dark-mode .sidebar{

      background:rgba(2,6,23,0.92);
    }

    .dark-mode .sidebar a{

      color:#f1f5f9;
    }

    .dark-mode .sidebar a:hover{

      background:rgba(255,255,255,0.08);
    }

    .dark-mode .menu-toggle{

      background:#2563eb;

      color:white;
    }

    @media(max-width:768px){

      .sidebar{
        width:180px;
      }

      .main-content{
        margin-left:0;
        padding:16px;
      }

      .hero{
        padding:30px;
      }

      .hero h1{
        font-size:28px;
      }

      .section-title{
        font-size:24px;
      }
    }

  </style>

</head>

<body>

  <button
    class="menu-toggle"
    onclick="toggleSidebar()"
  >
    ☰
  </button>

  <div class="sidebar" id="sidebar">

    <h2>
       Dashboard
    </h2>

    <a href="/">
      Home
    </a>

    <a href="#analytics">
    Analytics
  </a>

  <a href="#reports">
    Reports
  </a>

  <a href="#insights">
    AI Insights
  </a>

  <a href="#" onclick="toggleDarkMode()">
    🌙 Dark Mode
  </a>

</div>

  <div class="main-content">

    <div class="hero" id="home">

      <h1>
        AI Employee Analytics
      </h1>

      <p>
        Transform employee feedback into actionable insights using AI sentiment analysis and intelligent reporting dashboards.
      </p>

    </div>

    {% block content %}{% endblock %}

    <div class="footer">
      © 2026 AI Employee Analytics Platform
    </div>

  </div>

  <script>

    function showLoader(){

      const loader =
        document.getElementById("loader");

      if(loader){
        loader.style.display = "block";
      }

    }

    function toggleDarkMode(){

      document.body.classList.toggle(
        "dark-mode"
      );

    }

    function toggleSidebar(){

      const sidebar =
        document.getElementById("sidebar");

      const mainContent =
        document.querySelector(".main-content");

      sidebar.classList.toggle("hidden");

      mainContent.classList.toggle("full");

    }

  </script>

</body>

</html>
